server {
	listen 80;
	listen [::]:80;
	server_name localhost;

	root /usr/share/nginx/html;
	index index.html index.htm;

	# General headers applied to all routes.
	# NOTE: add_header does not merge across levels — any location block that
	# declares its own add_header discards every inherited one, so these have to
	# be repeated in each such block (see /sw.js below).
	add_header X-Frame-Options "DENY" always;
	add_header X-XSS-Protection "1; mode=block" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header Referrer-Policy "no-referrer-when-downgrade" always;
	add_header Permissions-Policy "interest-cohort=()" always;

	# Error 404
	error_page 404 /404.html;

	# Redirects
	location ~ ^/artikel/(.*)$ {
		return 301 /$1;
	}

	# Special handling for /sw.js
	location = /sw.js {
		add_header X-Frame-Options "DENY" always;
		add_header X-XSS-Protection "1; mode=block" always;
		add_header X-Content-Type-Options "nosniff" always;
		add_header Referrer-Policy "no-referrer-when-downgrade" always;
		add_header Permissions-Policy "interest-cohort=()" always;
		add_header Cache-Control "max-age=0, no-cache, no-store, must-revalidate" always;
	}

	# Handling missing pages. This is a static site, so an unknown URL must 404
	# rather than fall back to the homepage — a 200 there would be a soft 404.
	location / {
		try_files $uri $uri/ =404;
	}
}
